[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mokka-ecu-lab"
version = "0.2.2"
description = "Local read-only OBD-II acquisition and offline research"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7", "pyserial>=3.5,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[project.scripts]
mokka-ecu-lab = "mokka_ecu_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["mokka_ecu_lab*"]

[tool.setuptools.package-data]
mokka_ecu_lab = ["sensors/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
